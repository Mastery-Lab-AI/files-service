# ----------------------------------------------------------------------
# cloudbuild.yaml for TypeScript/Node.js Docker Build
# ----------------------------------------------------------------------
steps:
- name: 'gcr.io/cloud-builders/docker'
  id: Docker-Build
  args: 
    - 'build'
    - '-t'
    - 'gcr.io/$PROJECT_ID/filesservice-api:$TAG_NAME'
    - '-t'
    - 'gcr.io/$PROJECT_ID/filesservice-api:latest' # Tag the image as 'latest' as well
    - '.'
    
- name: 'gcr.io/cloud-builders/docker'
  id: Docker-Push
  args: 
    - 'push'
    - 'gcr.io/$PROJECT_ID/filesservice-api:$TAG_NAME'

images:
- 'gcr.io/$PROJECT_ID/filesservice-api:$TAG_NAME'
- 'gcr.io/$PROJECT_ID/filesservice-api:latest'

options:
  # If you are using a custom service account, include one of these:
  logging: CLOUD_LOGGING_ONLY 
  # default_logs_bucket_behavior: REGIONAL_USER_OWNED_BUCKET
  diskSizeGb: '100' # Increase disk space if you have many dependencies or a large project
